name        : difftastic
version     : "0.71.0"
release     : 3
homepage    : https://github.com/Wilfred/difftastic
upstreams   :
    - https://github.com/Wilfred/difftastic/archive/refs/tags/0.71.0.tar.gz : d6afd26103c6492a91307dc6779c7dd0ca4d4c85499f81d7dc53fdfa5107331d
summary     : Structural diff tool that compares files based on their syntax.
description : |
    Difftastic is a CLI diff tool that compares files based on their syntax,
    not line-by-line. Difftastic produces accurate diffs that are easier for humans
    to read. 
license     : MIT
builddeps   :
    - binary(cargo)
    - binary(make)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install difft
check       : |
    %cargo_test
