name        : noctalia-greeter
version     : "1.3.1"
release     : 10
homepage    : https://github.com/noctalia-dev/noctalia-greeter
upstreams   :
    - https://github.com/noctalia-dev/noctalia-greeter/archive/refs/tags/v1.3.1.tar.gz : c3a2fce1d15efcf9c87f22b149d03c7dd378f273290c1488190cf8445edbc14d
summary     : Login greeter that matches the look and feel of Noctalia Shell.
description : |
    
license     : MIT
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libwebp)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pango)
    - pkgconfig(tomlplusplus)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wlroots-0.20)
    - stb
rundeps     :
    - binary(greetd)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install

    # Systemd bits
    %install_file %(pkgdir)/noctalia-greeter.service %(installroot)%(libdir)/systemd/system/noctalia-greeter.service
    %install_file %(pkgdir)/noctalia-greeter.toml %(installroot)%(datadir)/greetd/noctalia-greeter.toml

    # Override tmpfile config created by meson to use the correct user
    rm -f %(installroot)%(tmpfilesdir)/noctalia-greeter.conf
    %tmpfiles 'd /var/lib/noctalia-greeter 0750 greetd greetd -'
