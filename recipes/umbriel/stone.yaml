name        : umbriel
version     : "0.1.0"
release     : 12
homepage    : https://github.com/noctalia-dev/umbriel
license     : MIT
upstreams   :
    - git|https://github.com/noctalia-dev/umbriel:
        ref: 8bdb8cc34c10678eacd2b5f57aa4ebf975deae94
summary     : A Wayland compositor built on wlroots and SceneFX.
description : |
    A Wayland compositor built on wlroots and SceneFX.
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pangocairo)
    - pkgconfig(tomlplusplus)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-server)
    - pkgconfig(wlroots-0.20)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(xwayland-satellite)
    - xdg-desktop-portal-umbriel
setup       : |
    export CFLAGS="${CFLAGS//-D_FORTIFY_SOURCE=3/}"
    export CXXFLAGS="${CXXFLAGS//-D_FORTIFY_SOURCE=3/}"
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
